<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rewrite - Smart Helper</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f7fb;
    }

    .container {
      max-width: 700px;
      margin: auto;
      padding: 35px 20px;
    }

    .back {
      display: inline-block;
      margin-bottom: 25px;
      color: #2563eb;
      cursor: pointer;
    }

    h1 {
      margin-bottom: 8px;
    }

    p {
      color: #6b7280;
    }

    textarea {
      width: 100%;
      height: 180px;
      padding: 15px;
      margin-top: 20px;
      box-sizing: border-box;
      border: 1px solid #d1d5db;
      border-radius: 14px;
      font-size: 16px;
      resize: vertical;
    }

    button {
      width: 100%;
      padding: 15px;
      margin-top: 15px;
      border: none;
      border-radius: 12px;
      background: #2563eb;
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    #result {
      margin-top: 25px;
      padding: 20px;
      background: white;
      border-radius: 14px;
      min-height: 50px;
    }
  </style>
</head>

<body>

<div class="container">

  <div class="back" onclick="history.back()">← Back</div>

  <h1>✍️ Rewrite</h1>

  <p>Improve your text and make it clearer.</p>

  <textarea id="text"
    placeholder="Write your text here..."></textarea>

  <button onclick="rewriteText()">
    Rewrite Text
  </button>

  <div id="result">
    Your improved text will appear here.
  </div>

</div>

<script>

function rewriteText() {

  const text = document.getElementById("text").value.trim();
  const result = document.getElementById("result");

  if (!text) {
    result.innerText = "Please write something first.";
    return;
  }

  result.innerText =
    "AI rewriting will be connected later when API credits are available.\n\nYour text:\n" +
    text;
}

</script>

</body>
</html>s
